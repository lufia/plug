name: CodeQL
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: '17 2 * * 6'
jobs:
  analyze:
    permissions:
      security-events: write
    strategy:
      matrix:
        language:
        - go
        - actions
        include:
        - build-mode: none
        - build-mode: manual
          language: go
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: lufia/workflows/.github/actions/setup-codeql@87182a21e45d32572eea26d16b42baf1e5da0537 # v0.12.0
      with:
        language: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - run: go build ./...
      if: matrix.language == 'go'
    - uses: lufia/workflows/.github/actions/codeql@87182a21e45d32572eea26d16b42baf1e5da0537 # v0.12.0
      with:
        language: ${{ matrix.language }}
