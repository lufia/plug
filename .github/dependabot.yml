version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    monthly-batch:
      patterns:
        - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    monthly-batch:
      patterns:
        - '*'
